  <rect id="shadow-topleft" x="170" y="10" width="14" height="14" fill="url(#shTL)"/>
  <rect id="shadow-top" x="184" y="10" width="32" height="14" fill="url(#shTop)"/>
  <rect id="shadow-topright" x="216" y="10" width="14" height="14" fill="url(#shTR)"/>
  <rect id="shadow-left" x="170" y="24" width="14" height="32" fill="url(#shLeft)"/>
  <rect id="shadow-center" x="184" y="24" width="32" height="32" fill="#000000" fill-opacity="0"/>
  <rect id="shadow-right" x="216" y="24" width="14" height="32" fill="url(#shRight)"/>
  <rect id="shadow-bottomleft" x="170" y="56" width="14" height="14" fill="url(#shBL)"/>
  <rect id="shadow-bottom" x="184" y="56" width="32" height="14" fill="url(#shBottom)"/>
  <rect id="shadow-bottomright" x="216" y="56" width="14" height="14" fill="url(#shBR)"/>

  <rect id="shadow-hint-top-margin" x="170" y="92" width="4" height="8" fill="#bf616a"/>
  <rect id="shadow-hint-bottom-margin" x="178" y="92" width="4" height="14" fill="#bf616a"/>
  <rect id="shadow-hint-left-margin" x="186" y="92" width="12" height="4" fill="#bf616a"/>
  <rect id="shadow-hint-right-margin" x="202" y="92" width="12" height="4" fill="#bf616a"/>

  <!-- Content padding hints -->
  <rect id="hint-top-margin" x="10" y="92" width="4" height="4" fill="#ebcb8b"/>
  <rect id="hint-bottom-margin" x="18" y="92" width="4" height="4" fill="#ebcb8b"/>
  <rect id="hint-left-margin" x="26" y="92" width="8" height="4" fill="#ebcb8b"/>
  <rect id="hint-right-margin" x="40" y="92" width="8" height="4" fill="#ebcb8b"/>
  <rect id="hint-stretch-borders" x="56" y="92" width="2" height="2" fill="#b48ead"/>

  <!-- Floating panel inset hints (10px margin) -->
  <rect id="floating-center" x="10" y="128" width="32" height="32" fill="#141a24" fill-opacity="0.74"/>
  <rect id="floating-hint-top-margin" x="52" y="128" width="4" height="10" fill="#88c0d0"/>
  <rect id="floating-hint-bottom-margin" x="60" y="128" width="4" height="10" fill="#88c0d0"/>
  <rect id="floating-hint-left-margin" x="68" y="128" width="10" height="4" fill="#88c0d0"/>
  <rect id="floating-hint-right-margin" x="82" y="128" width="10" height="4" fill="#88c0d0"/>

  <!-- Thick panel hints -->
  <rect id="thick-center" x="110" y="128" width="32" height="32" fill="#141a24" fill-opacity="0.74"/>
  <rect id="thick-hint-top-margin" x="150" y="128" width="4" height="6" fill="#a3be8c"/>
  <rect id="thick-hint-bottom-margin" x="158" y="128" width="4" height="6" fill="#a3be8c"/>
  <rect id="thick-hint-left-margin" x="166" y="128" width="10" height="4" fill="#a3be8c"/>
  <rect id="thick-hint-right-margin" x="180" y="128" width="10" height="4" fill="#a3be8c"/>
</svg>
