  <rect id="hint-right-margin" x="40" y="96" width="8" height="4" fill="#ebcb8b"/>

  <rect id="hint-stretch-borders" x="56" y="96" width="2" height="2" fill="#b48ead"/>

  <!-- Floating panel inset hints (10px margin) -->
  <rect id="floating-center" x="10" y="138" width="32" height="32" fill="#141a24" fill-opacity="0.90"/>
  <rect id="floating-hint-top-margin" x="52" y="138" width="4" height="10" fill="#88c0d0"/>
  <rect id="floating-hint-bottom-margin" x="60" y="138" width="4" height="10" fill="#88c0d0"/>
  <rect id="floating-hint-left-margin" x="68" y="138" width="10" height="4" fill="#88c0d0"/>
  <rect id="floating-hint-right-margin" x="82" y="138" width="10" height="4" fill="#88c0d0"/>

