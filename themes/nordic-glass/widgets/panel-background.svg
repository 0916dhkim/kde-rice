  <rect id="shadow-hint-right-inset" x="200" y="112" width="10" height="4" fill="#d08770"/>

  <!-- Content padding hints (+ 1px rim inset on dialogs so collapseMarginsHint bleeds flush to the 1px border) -->
  <rect id="hint-top-margin" x="10" y="96" width="4" height="4" fill="#ebcb8b"/>
