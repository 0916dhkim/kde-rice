    <path d="M 10,21 A 11,11 0 0 1 21,10 L 22,10 L 22,11 L 21,11 A 10,10 0 0 0 11,21 L 11,22 L 10,22 Z" fill="#bad2ee" fill-opacity="0.18"/>
