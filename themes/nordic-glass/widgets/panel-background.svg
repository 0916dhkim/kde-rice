  </g>
  <g id="mask-top">
    <rect x="102" y="10" width="32" height="12" fill="none"/>
    <rect x="102" y="11" width="32" height="11" fill="#000000"/>
  </g>
  <g id="mask-topright">
    <rect x="134" y="10" width="12" height="12" fill="none"/>
    <path d="M 134,11 L 135,11 A 10,10 0 0 1 145,21 L 145,22 L 134,22 Z" fill="#000000"/>
  </g>
  <g id="mask-left">
    <rect x="90" y="22" width="12" height="32" fill="none"/>
    <rect x="91" y="22" width="11" height="32" fill="#000000"/>
  </g>
  <rect id="mask-center" x="102" y="22" width="32" height="32" fill="#000000"/>
  <g id="mask-right">
    <rect x="134" y="22" width="12" height="32" fill="none"/>
    <rect x="134" y="22" width="11" height="32" fill="#000000"/>
  </g>
  <g id="mask-bottomleft">
