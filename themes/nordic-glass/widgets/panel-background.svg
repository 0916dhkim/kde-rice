      <stop offset="52.4%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="73.8%" stop-color="#000000" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
