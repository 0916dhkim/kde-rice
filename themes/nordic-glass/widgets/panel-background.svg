    <path d="M 134,54 L 145,54 L 145,55 A 10,10 0 0 1 135,65 L 134,65 Z" fill="#000000"/>
  </g>

  <!-- Elevation shadow 9-slice frame (Breeze-compliant SC x SC corners with rounded cutout + inset hints) -->
  <g id="shadow-topleft">
    <rect x="170" y="10" width="22" height="22" fill="none"/>
    <path d="M 170,31 A 21,21 0 0 1 191,10 L 192,10 L 192,20 L 191,20 A 11,11 0 0 0 180,31 L 180,32 L 170,32 Z" fill="url(#shTL)"/>
  </g>
  <g id="shadow-top">
    <rect x="192" y="10" width="32" height="22" fill="none"/>
    <rect x="192" y="10" width="32" height="10" fill="url(#shTop)"/>
  </g>
  <g id="shadow-topright">
    <rect x="224" y="10" width="22" height="22" fill="none"/>
    <path d="M 224,10 L 225,10 A 21,21 0 0 1 246,31 L 246,32 L 236,32 L 236,31 A 11,11 0 0 0 225,20 L 224,20 Z" fill="url(#shTR)"/>
  </g>
  <g id="shadow-left">
