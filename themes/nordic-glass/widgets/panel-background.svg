    <path d="M 10,54 L 22,54 L 22,66 L 21,66 A 11,11 0 0 1 10,55 Z" fill="#141a24" fill-opacity="0.90"/>
    <path d="M 10,54 L 11,54 L 11,55 A 10,10 0 0 0 21,65 L 22,65 L 22,66 L 21,66 A 11,11 0 0 1 10,55 Z" fill="#bad2ee" fill-opacity="0.18"/>
