    <path d="M 10,22 A 12,12 0 0 1 22,10 L 22,10 L 22,11 L 22,11 A 11,11 0 0 0 11,22 L 11,22 L 10,22 Z" fill="#bad2ee" fill-opacity="0.16"/>
