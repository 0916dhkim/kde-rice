  <g id="mask-topright">
    <rect x="134" y="10" width="12" height="12" fill="none"/>
    <path d="M 134,11 L 134,11 A 11,11 0 0 1 145,22 L 145,22 L 134,22 Z" fill="#000000"/>
  </g>
  <g id="mask-left">
