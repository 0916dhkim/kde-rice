      <stop offset="75.0%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shTR" gradientUnits="userSpaceOnUse" cx="224" cy="32" r="22">
